<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>opc-web-console</title>
    <script>
      /* ADR-052 防主题闪烁：渲染前按持久化选择设置 data-theme（CSS 变量切换） */
      try {
        if (localStorage.getItem('opc:theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) {
        /* 隐私模式下忽略 */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
