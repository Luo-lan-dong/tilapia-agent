[project]
name = "opc-agent-office"
version = "0.1.0"
description = "OPC Linux office agent node（ADR-062：文档/PPT/查资料）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "OPC Team" },
]
keywords = ["opc", "agent", "office", "linux"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0",
    "psutil>=6.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "matplotlib>=3.8",
    "scrapling[fetchers]>=0.4,<0.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.client", "app.executor", "app.tools", "app.models", "app.utils"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"
